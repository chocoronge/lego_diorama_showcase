<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 레고 디오라마 쇼케이스</title>
    <style>
        body {
            font-family: 'Jua', 'Segoe UI', sans-serif, AppleSDGothicNeo;
            background: linear-gradient(135deg, #fbcfe8 0%, #e0e7ff 100%);
            color: #475569;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.2);
            text-align: center;
            border: 3px solid #fde2e4;
        }
        h1 { font-size: 1.6rem; margin-bottom: 5px; color: #db2777; }
        .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; font-weight: bold; }
        
        .status {
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 14px;
            background: #f1f5f9;
            font-weight: bold;
            transition: 0.3s;
        }
        .status.connected { background: #dcfce7; color: #15803d; border: 2px dashed #86efac; }
        .status.disconnected { background: #fee2e2; color: #b91c1c; border: 2px dashed #fca5a5; }

        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        button:active { transform: scale(0.97); }
        button:disabled { background: #e2e8f0 !important; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        #connectBtn { background: #f472b6; color: white; font-size: 1.1rem; }
        #connectBtn:hover:not(:disabled) { background: #ec4899; }

        .control-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-mode { background: #fdf2f8; color: #be185d; border: 2px solid #fbcfe8; }
        .btn-mode:hover:not(:disabled) { background: #fce7f3; }
        
        .btn-off { background: #fee2e2; color: #991b1b; border: 2px solid #fecaca; }
        .btn-off:hover:not(:disabled) { background: #fecaca; }
        
        .btn-disconnect { background: #e2e8f0; color: #64748b; margin-top: 5px; }
        .btn-disconnect:hover { background: #cbd5e1; }

        .footer { margin-top: 25px; font-size: 0.75rem; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h1>🪄 LEGO Showcase</h1>
    <div class="subtitle">말랑말랑 스마트 무드등 제어 센터</div>

    <div id="status" class="status disconnected">💤 블루투스 연결을 기다리는 중이에요!</div>

    <button id="connectBtn" onclick="connectBLE()">✨ 블루투스 기기 톡! 연결하기</button>

    <div id="controls" class="control-group" style="display:none;">
        <button class="btn-mode" onclick="sendMode('warm')" id="btn-warm" disabled>🍯 포근한 감성 무드등</button>
        <button class="btn-mode" onclick="sendMode('sunset')" id="btn-sunset" disabled>🌅 살랑살랑 노을빛</button>
        <button class="btn-mode" onclick="sendMode('wave')" id="btn-wave" disabled>🌊 시원한 오션 웨이브</button>
        <button class="btn-mode" onclick="sendMode('rainbow')" id="btn-rainbow" disabled>🌈 알록달록 무지개 파티</button>
        <button class="btn-mode" onclick="sendMode('party')" id="btn-party" disabled>🎉 몽환적인 클럽 파티</button>
        <button class="btn-off" onclick="sendMode('off')" id="btn-off" disabled>🌙 조명 잠시 끄기</button>
        <button class="btn-disconnect" onclick="disconnectBLE()">👋 연결 끊기</button>
    </div>

    <div class="footer">LEGO Diorama Showcase v4.3 (Cute Edition)</div>
</div>

<script>
    const correctPassword = "1234"; // 💡 필요시 비밀번호 수정
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    async function connectBLE() {
        try {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "🔍 내 레고 기기를 찾는 중...";

            // 1. 기기 요청 (안정성을 위해 필터 정돈)
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'LegoDiorama' }],
                optionalServices: [SERVICE_UUID]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            statusDiv.innerText = "🔗 쇼케이스와 손잡는 중...";
            const server = await bluetoothDevice.gatt.connect();

            statusDiv.innerText = "📡 통신 채널 여는 중...";
            const service = await server.getPrimaryService(SERVICE_UUID);
            bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // 2. 비밀번호 인증 단계
            let password = prompt("💌 비밀번호를 입력해주세요:");
            
            if (password !== correctPassword) {
                alert("앗! 비밀번호가 틀렸어요. 다시 시도해 주세요! 🥲");
                if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                    bluetoothDevice.gatt.disconnect();
                }
                return;
            }

            // 인증 성공
            alert("✨ 비밀번호 통과! 환영합니다!");
            await bluetoothCharacteristic.writeValue(new TextEncoder().encode("PIN:OK"));

            // UI 변경 (연결 성공)
            statusDiv.className = "status connected";
            statusDiv.innerText = "🎉 연결 완료 (" + bluetoothDevice.name + ")";
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            
            setButtonsEnabled(true);

        } catch (error) {
            console.log("연결 실패:", error);
            const statusDiv = document.getElementById('status');
            statusDiv.className = "status disconnected";
            statusDiv.innerText = "💦 연결이 취소되었거나 실패했어요.";
            document.getElementById('connectBtn').disabled = false;
        }
    }

    async function sendMode(mode) {
        if (!bluetoothCharacteristic) {
            alert("⚠️ 블루투스 연결이 끊어져 있어요!");
            return;
        }
        try {
            const encoder = new TextEncoder();
            await bluetoothCharacteristic.writeValue(encoder.encode(mode));
        } catch (error) {
            console.log("명령 전송 실패:", error);
            alert("💦 명령 전달에 실패했어요. 다시 시도해 주세요!");
        }
    }

    function disconnectBLE() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    }

    function onDisconnected() {
        const statusDiv = document.getElementById('status');
        statusDiv.className = "status disconnected";
        statusDiv.innerText = "💤 블루투스 연결이 해제되었어요.";
        
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('controls').style.display = 'none';
        setButtonsEnabled(false);
        
        bluetoothDevice = null;
        bluetoothCharacteristic = null;
    }

    function setButtonsEnabled(enabled) {
        document.getElementById('btn-warm').disabled = !enabled;
        document.getElementById('btn-sunset').disabled = !enabled;
        document.getElementById('btn-wave').disabled = !enabled;
        document.getElementById('btn-rainbow').disabled = !enabled;
        document.getElementById('btn-party').disabled = !enabled;
        document.getElementById('btn-off').disabled = !enabled;
    }
</script>

</body>
</html>
