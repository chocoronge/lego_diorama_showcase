<!DOCTYPE html>
<!-- VERSION: 1.8 | Updated: 2026-08-25 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f5ff" />
  <title>Diorama Showcase</title>

  <style>
    :root {
      --bg1: #f7f5ff;
      --bg2: #fff7fb;
      --card: rgba(255,255,255,.78);
      --line: rgba(102, 94, 180, .14);
      --text: #29263a;
      --muted: #85819a;
      --accent: #6f63e8;
      --accent2: #f27bb2;
      --success: #2a9d72;
      --danger: #d85a72;
      --shadow: 0 24px 70px rgba(74, 65, 130, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(242,123,178,.22), transparent 32%),
        radial-gradient(circle at 90% 15%, rgba(111,99,232,.18), transparent 30%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      font-family:
        "Segoe UI",
        "Pretendard",
        "Apple SD Gothic Neo",
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
    }

    .app {
      width: min(100%, 430px);
      position: relative;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 30px;
      padding: 28px 22px 22px;
      box-shadow: var(--shadow);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      text-align: left;
    }

    .brand-kicker {
      font-size: 12px;
      letter-spacing: .14em;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(22px, 5.4vw, 29px);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .spark {
      font-family:
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
    }

    .version {
      font-size: 11px;
      font-weight: 800;
      color: #6d6880;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      border-radius: 18px;
      padding: 13px 14px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 750;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.6);
      text-align: left;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #a6a2b3;
      box-shadow: 0 0 0 5px rgba(166,162,179,.13);
    }

    .status.connected .dot {
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(42,157,114,.13);
    }

    .status.disconnected .dot {
      background: var(--danger);
      box-shadow: 0 0 0 5px rgba(216,90,114,.12);
    }

    button {
      width: 100%;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.985); }
    button:disabled { opacity: .43; cursor: default; }

    .primary {
      color: white;
      padding: 15px 16px;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--accent), #8c82f1 55%, var(--accent2));
      box-shadow: 0 12px 28px rgba(111,99,232,.25);
      margin-bottom: 16px;
    }

    .section-label {
      margin: 20px 2px 10px;
      text-align: left;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode {
      min-height: 92px;
      padding: 14px 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      color: var(--text);
      text-align: left;
      box-shadow: 0 8px 24px rgba(82,74,130,.07);
    }

    .mode .icon {
      font-size: 23px;
      margin-bottom: 10px;
      display: block;
      font-family:
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
    }

    .mode .name {
      font-size: 14px;
      line-height: 1.25;
      display: block;
    }

    .mode .desc {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 650;
    }

    .mode.off {
      grid-column: 1 / -1;
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,246,248,.86);
      color: #8e3b4f;
    }

    .mode.off .icon { margin: 0; }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary {
      padding: 12px 10px;
      border-radius: 15px;
      color: #68637b;
      background: rgba(238,236,246,.86);
      border: 1px solid rgba(98,91,140,.10);
      font-size: 13px;
    }

    .hint {
      margin-top: 18px;
      color: #aaa6b7;
      font-size: 11px;
      line-height: 1.55;
    }

    @media (max-width: 360px) {
      .mode-grid { grid-template-columns: 1fr; }
      .mode.off { grid-column: auto; }
      .bottom-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="card">
      <div class="topline">
        <div class="brand">
          <div class="brand-kicker">SMART LIGHTING</div>
          <h1><span class="spark">✦</span> DIORAMA SHOWCASE</h1>
        </div>
        <div class="version">BLE 5.0</div>
      </div>

      <div id="status" class="status disconnected">
        <span class="dot"></span>
        <span id="statusText">쇼케이스 연결을 기다리고 있어요.</span>
      </div>

      <button id="connectBtn" class="primary" onclick="connectBLE()">
        쇼케이스 연결하기
      </button>

      <button
        id="otherShowcaseBtn"
        class="secondary"
        onclick="forgetCurrentDevice()"
        style="display:none; margin-bottom:16px;"
      >
        다른 쇼케이스 연결
      </button>

      <div id="controls" style="display:none;">
        <div class="section-label">LIGHT SCENES</div>

        <div class="mode-grid">
          <button class="mode" onclick="sendMode('warm')" id="btn-warm" disabled>
            <span class="icon">☀️</span>
            <span class="name">Warm Glow</span>
            <span class="desc">포근한 숨쉬는 조명</span>
          </button>

          <button class="mode" onclick="sendMode('sunset')" id="btn-sunset" disabled>
            <span class="icon">🌅</span>
            <span class="name">Sunset</span>
            <span class="desc">주황과 보라의 노을빛</span>
          </button>

          <button class="mode" onclick="sendMode('wave')" id="btn-wave" disabled>
            <span class="icon">🌊</span>
            <span class="name">Ocean Wave</span>
            <span class="desc">화이트·블루 파도 효과</span>
          </button>

          <button class="mode" onclick="sendMode('rainbow')" id="btn-rainbow" disabled>
            <span class="icon">🌈</span>
            <span class="name">Rainbow</span>
            <span class="desc">부드럽게 회전하는 컬러</span>
          </button>

          <button class="mode" onclick="sendMode('party')" id="btn-party" disabled>
            <span class="icon">✨</span>
            <span class="name">Sparkle</span>
            <span class="desc">랜덤 컬러 스파클</span>
          </button>

          <button class="mode off" onclick="sendMode('off')" id="btn-off" disabled>
            <span class="icon">🌙</span>
            <span>
              <span class="name">Lights Off</span>
              <span class="desc">조명 OFF · 연결 유지</span>
            </span>
          </button>
        </div>

        <div class="bottom-actions">
          <button class="secondary" onclick="disconnectBLE()">연결 끊기</button>
          <button class="secondary" onclick="forgetCurrentDevice()">다른 쇼케이스</button>
        </div>
      </div>

      <div class="hint">
        연결이 끊기면 주황색으로 두 번 짧게 깜빡인 뒤 마지막 모드로 돌아갑니다.
      </div>
    </section>
  </main>

<script>
  const correctPassword = "1234";
  const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
  const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

  let bluetoothDevice = null;
  let bluetoothCharacteristic = null;

  // 같은 브라우저 탭에서는 새로고침 후에도 인증 상태를 기억합니다.
  // 탭/브라우저를 완전히 닫으면 sessionStorage가 사라져 다시 비밀번호를 묻게 됩니다.
  let authenticatedDeviceName =
    sessionStorage.getItem("showcaseAuthenticatedDevice") || "";

  let authenticated = false;
  let isConnecting = false;

  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const connectBtn = document.getElementById("connectBtn");
  const controls = document.getElementById("controls");

  async function connectBLE() {
    if (isConnecting) return;

    if (!navigator.bluetooth) {
      alert("이 브라우저에서는 Web Bluetooth를 사용할 수 없습니다.");
      return;
    }

    isConnecting = true;
    connectBtn.disabled = true;

    try {
      if (!bluetoothDevice) {
        setStatus(false, "가까운 쇼케이스를 찾고 있어요…");

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "Showcase" }],
          optionalServices: [SERVICE_UUID]
        });

        bluetoothDevice.addEventListener(
          "gattserverdisconnected",
          onDisconnected
        );
      }

      setStatus(false, "쇼케이스와 연결하는 중…");

      const server = bluetoothDevice.gatt.connected
        ? bluetoothDevice.gatt
        : await bluetoothDevice.gatt.connect();

      setStatus(false, "조명 제어 채널을 준비하는 중…");

      const service = await server.getPrimaryService(SERVICE_UUID);
      bluetoothCharacteristic =
        await service.getCharacteristic(CHARACTERISTIC_UUID);

      // 이전에 이 탭에서 인증한 바로 그 쇼케이스라면
      // 같은 기기 재연결/새로고침 후 재선택 시 비밀번호 입력을 생략합니다.
      authenticated =
        !!bluetoothDevice?.name &&
        authenticatedDeviceName === bluetoothDevice.name;

      if (!authenticated) {
        const password = prompt("쇼케이스 비밀번호를 입력해 주세요.");

        if (password !== correctPassword) {
          alert("비밀번호가 일치하지 않습니다.");

          if (bluetoothDevice?.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
          }
          return;
        }

        await bluetoothCharacteristic.writeValue(
          new TextEncoder().encode("PIN:OK")
        );

        authenticated = true;

        authenticatedDeviceName = bluetoothDevice?.name || "";
        sessionStorage.setItem(
          "showcaseAuthenticatedDevice",
          authenticatedDeviceName
        );

        setStatus(true, "인증이 완료됐어요. 조명을 선택해 보세요.");
        await new Promise(resolve => setTimeout(resolve, 550));
      }

      setConnectedUI();

    } catch (error) {
      console.error("BLE 연결 실패:", error);

      setStatus(false, "연결하지 못했어요. 잠시 후 다시 시도해 주세요.");

      connectBtn.style.display = "block";
      connectBtn.textContent = bluetoothDevice
        ? "같은 쇼케이스 다시 연결"
        : "쇼케이스 연결하기";

      controls.style.display = "none";
      setButtonsEnabled(false);

    } finally {
      isConnecting = false;
      connectBtn.disabled = false;
    }
  }

  function setConnectedUI() {
    setStatus(
      true,
      `연결됨 · ${bluetoothDevice?.name || "Showcase"}`
    );

    connectBtn.style.display = "none";
    controls.style.display = "block";

    const otherBtn = document.getElementById("otherShowcaseBtn");
    if (otherBtn) otherBtn.style.display = "none";

    setButtonsEnabled(true);
  }

  async function sendMode(mode) {
    if (
      !bluetoothDevice ||
      !bluetoothDevice.gatt.connected ||
      !bluetoothCharacteristic
    ) {
      alert("쇼케이스 연결이 끊어져 있습니다.");
      return;
    }

    try {
      await bluetoothCharacteristic.writeValue(
        new TextEncoder().encode(mode)
      );
    } catch (error) {
      console.error("명령 전송 실패:", error);
      alert("조명 명령을 보내지 못했어요. 연결 상태를 확인해 주세요.");
    }
  }

  function disconnectBLE() {
    if (bluetoothDevice?.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    bluetoothCharacteristic = null;

    // 같은 쇼케이스 재연결 시에는 인증을 유지합니다.
    // 다른 쇼케이스를 선택하거나 탭/브라우저를 닫으면 다시 인증합니다.

    setStatus(
      false,
      "연결 끊김 · 마지막 모드 유지"
    );

    controls.style.display = "none";
    setButtonsEnabled(false);

    connectBtn.style.display = "block";
    connectBtn.disabled = false;
    connectBtn.textContent = "같은 쇼케이스 다시 연결";

    // 연결이 끊긴 상태에서는 다른 쇼케이스도 선택할 수 있게 표시
    let otherBtn = document.getElementById("otherShowcaseBtn");
    if (otherBtn) {
      otherBtn.style.display = "block";
    }
  }

  function forgetCurrentDevice() {
    if (bluetoothDevice?.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }

    bluetoothDevice = null;
    bluetoothCharacteristic = null;
    authenticated = false;
    authenticatedDeviceName = "";

    sessionStorage.removeItem("showcaseAuthenticatedDevice");

    setStatus(false, "새 쇼케이스를 선택할 준비가 됐어요.");

    connectBtn.style.display = "block";
    connectBtn.textContent = "쇼케이스 연결하기";
    controls.style.display = "none";

    const otherBtn = document.getElementById("otherShowcaseBtn");
    if (otherBtn) otherBtn.style.display = "none";

    setButtonsEnabled(false);
  }

  function setStatus(connected, text) {
    status.className = connected
      ? "status connected"
      : "status disconnected";

    statusText.textContent = text;
  }

  function setButtonsEnabled(enabled) {
    [
      "btn-warm",
      "btn-sunset",
      "btn-wave",
      "btn-rainbow",
      "btn-party",
      "btn-off"
    ].forEach(id => {
      document.getElementById(id).disabled = !enabled;
    });
  }
</script>
</body>
</html>
