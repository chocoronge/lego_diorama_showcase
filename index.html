<!DOCTYPE html>
<!-- VERSION: 3.2-TFT-LOGO-ICONS | Updated: 2026-08-31 | BASED ON v2.4 + TFT DATE/WEATHER SYNC -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f5ff" />
  <title>Diorama Showcase</title>

  <style>
    :root {
      --bg1: #f7f5ff;
      --bg2: #fff7fb;
      --card: rgba(255,255,255,.78);
      --line: rgba(102, 94, 180, .14);
      --text: #29263a;
      --muted: #85819a;
      --accent: #6f63e8;
      --accent2: #f27bb2;
      --success: #2a9d72;
      --danger: #d85a72;
      --shadow: 0 24px 70px rgba(74, 65, 130, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(242,123,178,.22), transparent 32%),
        radial-gradient(circle at 90% 15%, rgba(111,99,232,.18), transparent 30%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      font-family:
        "Segoe UI",
        "Pretendard",
        "Apple SD Gothic Neo",
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
    }

    .app {
      width: min(100%, 560px);
      position: relative;
      transition: width .32s ease;
    }

    .app.connected-layout {
      width: min(100%, 860px);
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 30px;
      padding: 28px 22px 22px;
      box-shadow: var(--shadow);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand { text-align: left; }

    .brand-kicker {
      font-size: 12px;
      letter-spacing: .14em;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(22px, 5.4vw, 29px);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .spark {
      font-family:
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
    }

    .version {
      font-size: 11px;
      font-weight: 800;
      color: #6d6880;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      padding: 8px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      border-radius: 18px;
      padding: 13px 14px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 750;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.6);
      text-align: left;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #a6a2b3;
      box-shadow: 0 0 0 5px rgba(166,162,179,.13);
    }

    .status.connected .dot {
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(42,157,114,.13);
    }

    .status.disconnected .dot {
      background: var(--danger);
      box-shadow: 0 0 0 5px rgba(216,90,114,.12);
    }

    button {
      width: 100%;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.985); }
    button:disabled { opacity: .43; cursor: default; }

    .primary {
      color: white;
      padding: 15px 16px;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--accent), #8c82f1 55%, var(--accent2));
      box-shadow: 0 12px 28px rgba(111,99,232,.25);
      margin-bottom: 16px;
    }

    .section-label {
      margin: 20px 2px 10px;
      text-align: left;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .mode {
      min-height: 92px;
      padding: 14px 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      color: var(--text);
      text-align: left;
      box-shadow: 0 8px 24px rgba(82,74,130,.07);
    }

    .mode .icon {
      font-size: 23px;
      margin-bottom: 10px;
      display: block;
      font-family:
        "Segoe UI Emoji",
        "Apple Color Emoji",
        "Noto Color Emoji",
        sans-serif;
    }

    .mode .name {
      font-size: 14px;
      line-height: 1.25;
      display: block;
    }

    .mode .desc {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 650;
    }

    .mode.off {
      min-height: 92px;
      display: block;
      background: rgba(255,246,248,.86);
      color: #8e3b4f;
    }

    .mode.off .icon { margin-bottom: 10px; }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary {
      padding: 12px 10px;
      border-radius: 15px;
      color: #68637b;
      background: rgba(238,236,246,.86);
      border: 1px solid rgba(98,91,140,.10);
      font-size: 13px;
    }

    .hint {
      margin-top: 18px;
      color: #aaa6b7;
      font-size: 11px;
      line-height: 1.55;
    }

    .intro-copy {
      margin: 2px 2px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .intro-copy strong {
      color: #625b82;
      font-weight: 900;
    }

    .app.connected-layout .intro-copy { display: none; }

    .weather-source {
      margin: 12px 0 2px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 10px;
      align-items: center;
    }

    .weather-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      padding: 12px 40px 12px 13px;
      border-radius: 15px;
      border: 1px solid var(--line);
      color: var(--text);
      background:
        linear-gradient(45deg, transparent 50%, #77718b 50%) calc(100% - 18px) 50% / 6px 6px no-repeat,
        linear-gradient(135deg, #77718b 50%, transparent 50%) calc(100% - 13px) 50% / 6px 6px no-repeat,
        rgba(255,255,255,.78);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      outline: none;
    }

    .weather-action {
      height: 46px;
      border-radius: 15px;
      color: #5149b8;
      background: rgba(236, 239, 255, .94);
      border: 1px solid rgba(111,99,232,.12);
      font-size: 13px;
      white-space: nowrap;
    }

    .weather-source-note {
      grid-column: 1 / -1;
      margin: 0 2px;
      font-size: 10px;
      line-height: 1.45;
      color: var(--muted);
    }

    .weather-panel {
      margin: 12px 0 2px;
      padding: 15px 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.68);
      text-align: left;
      display: none;
    }

    .weather-panel.show { display: block; }

    .weather-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 7px;
    }

    .weather-icon { font-size: 30px; }
    .weather-condition { font-size: 17px; font-weight: 900; }
    .weather-detail { font-size: 12px; color: var(--muted); line-height: 1.55; }
    .weather-mode { margin-top: 7px; font-size: 12px; font-weight: 850; color: var(--accent); }

    @media (max-width: 700px) {
      body { padding: 16px; }
      .card { padding: 24px 18px 20px; border-radius: 26px; }
      .mode-grid { grid-template-columns: 1fr 1fr; }
      .weather-source { grid-template-columns: 1fr; }
      .weather-source-note { grid-column: auto; }
    }

    @media (max-width: 380px) {
      .mode-grid { grid-template-columns: 1fr; }
      .bottom-actions { grid-template-columns: 1fr; }
      h1 { white-space: normal; }
    }
  </style>
</head>

<body>
  <main id="app" class="app">
    <section class="card">
      <div class="topline">
        <div class="brand">
          <div class="brand-kicker">SMART LIGHTING</div>
          <h1><span class="spark">✦</span> DIORAMA SHOWCASE</h1>
        </div>
        <div class="version">BLE 5.0 · TFT</div>
      </div>

      <div id="status" class="status disconnected">
        <span class="dot"></span>
        <span id="statusText">쇼케이스 연결을 기다리고 있어요.</span>
      </div>

      <div id="introCopy" class="intro-copy">
        <strong>세상의 날씨를, 나의 LEGO 공간으로.</strong><br>
        쇼케이스를 연결하고 나만의 빛을 시작하세요.
      </div>

      <button id="connectBtn" class="primary" onclick="connectBLE()">쇼케이스 연결하기</button>

      <button
        id="otherShowcaseBtn"
        class="secondary"
        onclick="forgetCurrentDevice()"
        style="display:none; margin-bottom:16px;"
      >
        다른 쇼케이스 연결
      </button>

      <div id="controls" style="display:none;">
        <div class="section-label">LIVE WEATHER</div>

        <div class="weather-source">
          <select id="weatherSource" class="weather-select" aria-label="Live Weather 지역 선택">
            <option value="seoul" selected>📍 서울 · 기본</option>
            <option value="current">🧭 현재 위치</option>
            <option value="busan">🌊 부산</option>
            <option value="jeju">🌴 제주</option>
            <option value="tokyo">🗼 도쿄</option>
            <option value="paris">🗼 파리</option>
            <option value="london">🇬🇧 런던</option>
            <option value="newyork">🗽 뉴욕</option>
            <option value="sydney">🇦🇺 시드니</option>
          </select>
          <button class="weather-action" onclick="applyLiveWeather()" id="btn-weather" disabled>🌦️ Live Weather</button>
          <div class="weather-source-note">지역을 고른 뒤 Live Weather를 누르세요. 현재 위치는 브라우저 위치 권한이 필요합니다.</div>
        </div>

        <div id="weatherPanel" class="weather-panel" aria-live="polite">
          <div id="weatherTitle" class="weather-title">LIVE WEATHER · 서울</div>
          <div class="weather-main">
            <span id="weatherIcon" class="weather-icon">🌦️</span>
            <div>
              <div id="weatherCondition" class="weather-condition">날씨를 불러오는 중…</div>
              <div id="weatherDetail" class="weather-detail"></div>
            </div>
          </div>
          <div id="weatherMode" class="weather-mode"></div>
        </div>

        <div class="section-label">LIGHT SCENES</div>

        <div class="mode-grid">
          <button class="mode" onclick="sendMode('warm')" id="btn-warm" disabled>
            <span class="icon">☀️</span>
            <span class="name">Warm Glow</span>
            <span class="desc">포근한 숨쉬는 조명</span>
          </button>

          <button class="mode" onclick="sendMode('sunset')" id="btn-sunset" disabled>
            <span class="icon">🌅</span>
            <span class="name">Sunset</span>
            <span class="desc">주황과 보라의 노을빛</span>
          </button>

          <button class="mode" onclick="sendMode('wave')" id="btn-wave" disabled>
            <span class="icon">🌊</span>
            <span class="name">Ocean Wave</span>
            <span class="desc">화이트·블루 파도 효과</span>
          </button>

          <button class="mode" onclick="sendMode('rainbow')" id="btn-rainbow" disabled>
            <span class="icon">🌈</span>
            <span class="name">Rainbow</span>
            <span class="desc">부드럽게 회전하는 컬러</span>
          </button>

          <button class="mode" onclick="sendMode('party')" id="btn-party" disabled>
            <span class="icon">✨</span>
            <span class="name">Sparkle</span>
            <span class="desc">랜덤 컬러 스파클</span>
          </button>

          <button class="mode off" onclick="powerOffShowcase()" id="btn-off" disabled>
            <span class="icon">⏻</span>
            <span>
              <span class="name">Power Off</span>
              <span class="desc">쇼케이스 전원 종료</span>
            </span>
          </button>
        </div>

        <div class="bottom-actions">
          <button class="secondary" onclick="disconnectBLE()">연결 해제 · 전시 유지</button>
          <button class="secondary" onclick="forgetCurrentDevice()">다른 쇼케이스</button>
        </div>
      </div>

      <div class="hint">
        연결 해제는 블루투스만 종료하며 전시는 그대로 유지됩니다. Power Off는 쇼케이스 사용을 종료합니다.
      </div>
    </section>
  </main>

<script>
  const correctPassword = "1234";
  const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
  const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

  const WEATHER_PLACES = {
    seoul:   { name: "서울",   tftName: "SEOUL",   lat: 37.5665,  lon: 126.9780 },
    busan:   { name: "부산",   tftName: "BUSAN",   lat: 35.1796,  lon: 129.0756 },
    jeju:    { name: "제주",   tftName: "JEJU",    lat: 33.4996,  lon: 126.5312 },
    tokyo:   { name: "도쿄",   tftName: "TOKYO",   lat: 35.6762,  lon: 139.6503 },
    paris:   { name: "파리",   tftName: "PARIS",   lat: 48.8566,  lon: 2.3522 },
    london:  { name: "런던",   tftName: "LONDON",  lat: 51.5074,  lon: -0.1278 },
    newyork: { name: "뉴욕",   tftName: "NEW YORK",lat: 40.7128,  lon: -74.0060 },
    sydney:  { name: "시드니", tftName: "SYDNEY",  lat: -33.8688, lon: 151.2093 }
  };

  let bluetoothDevice = null;
  let bluetoothCharacteristic = null;

  let authenticatedDeviceName =
    sessionStorage.getItem("showcaseAuthenticatedDevice") || "";

  let authenticated = false;
  let isConnecting = false;
  let intentionalPowerOff = false;

  // BLE write를 항상 1개씩 순서대로 처리해 동시 write 충돌을 방지합니다.
  let bleWriteQueue = Promise.resolve();

  const app = document.getElementById("app");
  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const connectBtn = document.getElementById("connectBtn");
  const controls = document.getElementById("controls");
  const weatherPanel = document.getElementById("weatherPanel");
  const weatherSource = document.getElementById("weatherSource");
  const weatherTitle = document.getElementById("weatherTitle");
  const weatherIcon = document.getElementById("weatherIcon");
  const weatherCondition = document.getElementById("weatherCondition");
  const weatherDetail = document.getElementById("weatherDetail");
  const weatherMode = document.getElementById("weatherMode");

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function connectBLE() {
    if (isConnecting) return;

    if (!navigator.bluetooth) {
      alert("이 브라우저에서는 Web Bluetooth를 사용할 수 없습니다.");
      return;
    }

    isConnecting = true;
    connectBtn.disabled = true;

    try {
      if (!bluetoothDevice) {
        setStatus(false, "가까운 쇼케이스를 찾고 있어요…");

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "Showcase" }],
          optionalServices: [SERVICE_UUID]
        });

        bluetoothDevice.addEventListener(
          "gattserverdisconnected",
          onDisconnected
        );
      }

      setStatus(false, "쇼케이스와 연결하는 중…");

      const server = bluetoothDevice.gatt.connected
        ? bluetoothDevice.gatt
        : await bluetoothDevice.gatt.connect();

      setStatus(false, "조명 제어 채널을 준비하는 중…");

      const service = await server.getPrimaryService(SERVICE_UUID);
      bluetoothCharacteristic =
        await service.getCharacteristic(CHARACTERISTIC_UUID);

      authenticated =
        !!bluetoothDevice?.name &&
        authenticatedDeviceName === bluetoothDevice.name;

      if (!authenticated) {
        const password = prompt("쇼케이스 비밀번호를 입력해 주세요.");

        if (password !== correctPassword) {
          alert("비밀번호가 일치하지 않습니다.");

          if (bluetoothDevice?.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
          }
          return;
        }

        await writeBLEText("PIN:OK");

        authenticated = true;

        authenticatedDeviceName = bluetoothDevice?.name || "";
        sessionStorage.setItem(
          "showcaseAuthenticatedDevice",
          authenticatedDeviceName
        );

        setStatus(true, "인증이 완료됐어요. 조명을 선택해 보세요.");
        await sleep(550);
      }

      setConnectedUI();

    } catch (error) {
      console.error("BLE 연결 실패:", error);

      setStatus(false, "연결하지 못했어요. 잠시 후 다시 시도해 주세요.");

      connectBtn.style.display = "block";
      connectBtn.textContent = bluetoothDevice
        ? "같은 쇼케이스 다시 연결"
        : "쇼케이스 연결하기";

      controls.style.display = "none";
      setButtonsEnabled(false);

    } finally {
      isConnecting = false;
      connectBtn.disabled = false;
    }
  }

  function setConnectedUI() {
    setStatus(
      true,
      `연결됨 · ${bluetoothDevice?.name || "Showcase"}`
    );

    connectBtn.style.display = "none";
    controls.style.display = "block";

    const otherBtn = document.getElementById("otherShowcaseBtn");
    if (otherBtn) otherBtn.style.display = "none";

    setButtonsEnabled(true);
  }

  function writeBLEText(text) {
    bleWriteQueue = bleWriteQueue.then(async () => {
      if (
        !bluetoothDevice ||
        !bluetoothDevice.gatt.connected ||
        !bluetoothCharacteristic
      ) {
        throw new Error("쇼케이스 연결이 끊어져 있습니다.");
      }

      const payload = new TextEncoder().encode(text);

      // PROPERTY_WRITE를 사용하는 ESP32 쪽과 맞춰 가능하면 응답형 write 사용.
      // 일부 브라우저 구현에서는 writeValue()만 제공할 수 있어 fallback을 둡니다.
      if (typeof bluetoothCharacteristic.writeValueWithResponse === "function") {
        await bluetoothCharacteristic.writeValueWithResponse(payload);
      } else {
        await bluetoothCharacteristic.writeValue(payload);
      }

      // ESP32가 다음 짧은 명령을 처리할 아주 작은 여유를 줍니다.
      await sleep(35);
    });

    return bleWriteQueue;
  }

  async function sendMode(mode) {
    try {
      await writeBLEText(mode);
    } catch (error) {
      console.error("명령 전송 실패:", error);
      alert("조명 명령을 보내지 못했어요. 연결 상태를 확인해 주세요.");
    }
  }

  // TFT에 표시할 정보를 짧은 BLE 메시지 4개로 순차 전송
  async function sendTFTInfo({ dateText, weatherText, tempText, cityText }) {
    const messages = [
      `TDATE:${dateText}`,
      `TWX:${weatherText}`,
      `TTEMP:${tempText}`,
      `TCITY:${cityText}`
    ];

    for (const message of messages) {
      await writeBLEText(message);
    }
  }

  function getCurrentPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("이 브라우저는 위치 정보를 지원하지 않습니다."));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 300000
        }
      );
    });
  }

  function weatherInfoFromCode(code, isDay) {
    if (code === 0) {
      return isDay
        ? { icon: "☀️", label: "맑음", tftLabel: "SUNNY", mode: "wx_sunny", modeLabel: "SUNNY LIGHT" }
        : { icon: "🌙", label: "맑은 밤", tftLabel: "NIGHT", mode: "wx_night", modeLabel: "NIGHT LIGHT" };
    }

    if ([1, 2, 3].includes(code)) {
      return { icon: "☁️", label: code === 1 ? "대체로 맑음" : "흐림", tftLabel: "CLOUDY", mode: "wx_cloudy", modeLabel: "CLOUDY LIGHT" };
    }

    if ([45, 48].includes(code)) {
      return { icon: "🌫️", label: "안개", tftLabel: "FOG", mode: "wx_fog", modeLabel: "FOG LIGHT" };
    }

    if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code)) {
      return { icon: "🌧️", label: "비", tftLabel: "RAIN", mode: "wx_rain", modeLabel: "RAIN LIGHT" };
    }

    if ([71, 73, 75, 77, 85, 86].includes(code)) {
      return { icon: "❄️", label: "눈", tftLabel: "SNOW", mode: "wx_snow", modeLabel: "SNOW LIGHT" };
    }

    return { icon: "🌦️", label: "변화가 있는 날씨", tftLabel: "WEATHER", mode: "wx_cloudy", modeLabel: "WEATHER LIGHT" };
  }

  async function resolveWeatherPlace() {
    const selected = weatherSource.value;

    if (selected === "current") {
      weatherTitle.textContent = "LIVE WEATHER · 현재 위치";
      weatherCondition.textContent = "현재 위치와 날씨를 확인하는 중…";
      weatherDetail.textContent = "처음 사용할 때 위치 권한을 허용해 주세요.";

      const position = await getCurrentPosition();
      return {
        name: "현재 위치",
        tftName: "HERE",
        lat: position.coords.latitude,
        lon: position.coords.longitude
      };
    }

    const place = WEATHER_PLACES[selected] || WEATHER_PLACES.seoul;
    weatherTitle.textContent = `LIVE WEATHER · ${place.name}`;
    weatherCondition.textContent = `${place.name} 날씨를 확인하는 중…`;
    weatherDetail.textContent = "실시간 날씨 데이터를 불러오고 있어요.";
    return place;
  }

  // Open-Meteo가 반환한 지역 timezone 기준으로 TFT 날짜 생성
  function formatTFTDate(timeZone) {
    try {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: timeZone || undefined,
        month: "short",
        day: "2-digit",
        weekday: "short"
      }).formatToParts(new Date());

      const month = parts.find(p => p.type === "month")?.value?.toUpperCase() || "";
      const day = parts.find(p => p.type === "day")?.value || "";
      const weekday = parts.find(p => p.type === "weekday")?.value?.toUpperCase() || "";

      return `${month}${day} ${weekday}`;
    } catch (e) {
      console.warn("TFT 날짜 포맷 실패:", e);
      return "DATE";
    }
  }

  async function applyLiveWeather() {
    if (
      !bluetoothDevice ||
      !bluetoothDevice.gatt.connected ||
      !bluetoothCharacteristic
    ) {
      alert("먼저 쇼케이스를 연결해 주세요.");
      return;
    }

    const button = document.getElementById("btn-weather");
    button.disabled = true;
    weatherPanel.classList.add("show");
    weatherIcon.textContent = "🌦️";
    weatherMode.textContent = "";

    try {
      const place = await resolveWeatherPlace();

      const params = new URLSearchParams({
        latitude: Number(place.lat).toFixed(5),
        longitude: Number(place.lon).toFixed(5),
        current: "temperature_2m,weather_code,wind_speed_10m,is_day",
        timezone: "auto"
      });

      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?${params.toString()}`
      );

      if (!response.ok) {
        throw new Error(`날씨 서버 응답 오류 (${response.status})`);
      }

      const data = await response.json();
      const current = data.current;

      if (!current) {
        throw new Error("현재 날씨 정보를 찾지 못했습니다.");
      }

      const info = weatherInfoFromCode(
        Number(current.weather_code),
        Number(current.is_day) === 1
      );

      // 1) 기존 v2.4 날씨 조명 기능 유지
      await sendMode(info.mode);

      // 2) TFT에 날짜 / 날씨 / 온도 / 도시 정보 추가 전송
      const tftDate = formatTFTDate(data.timezone);
      const tftTemp = `${Math.round(Number(current.temperature_2m))}C`;

      await sendTFTInfo({
        dateText: tftDate,
        weatherText: info.tftLabel,
        tempText: tftTemp,
        cityText: place.tftName
      });

      weatherTitle.textContent = `LIVE WEATHER · ${place.name}`;
      weatherIcon.textContent = info.icon;
      weatherCondition.textContent = info.label;
      weatherDetail.textContent =
        `${Number(current.temperature_2m).toFixed(1)}°C · 풍속 ${Number(current.wind_speed_10m).toFixed(1)} km/h`;
      weatherMode.textContent =
        `💡 ${info.modeLabel} 적용됨 · TFT 정보도 업데이트되었습니다.`;

    } catch (error) {
      console.error("LIVE WEATHER 실패:", error);

      weatherIcon.textContent = "⚠️";
      weatherCondition.textContent = "날씨를 불러오지 못했어요.";

      if (error && error.code === 1) {
        weatherDetail.textContent = "위치 권한이 거부되었습니다. 다른 도시를 선택하거나 위치 권한을 허용해 주세요.";
      } else if (error && error.code === 2) {
        weatherDetail.textContent = "현재 위치를 확인할 수 없습니다. 다른 도시를 선택해 바로 사용할 수 있어요.";
      } else if (error && error.code === 3) {
        weatherDetail.textContent = "위치 확인 시간이 초과되었습니다. 다른 도시를 선택하거나 다시 시도해 주세요.";
      } else {
        weatherDetail.textContent = error?.message || "인터넷 연결 상태를 확인한 뒤 다시 시도해 주세요.";
      }

      weatherMode.textContent = "기존 조명 상태는 변경되지 않았습니다.";
    } finally {
      button.disabled = !(
        bluetoothDevice &&
        bluetoothDevice.gatt.connected &&
        bluetoothCharacteristic
      );
    }
  }

  async function powerOffShowcase() {
    if (
      !bluetoothDevice ||
      !bluetoothDevice.gatt.connected ||
      !bluetoothCharacteristic
    ) {
      alert("쇼케이스 연결이 끊어져 있습니다.");
      return;
    }

    try {
      intentionalPowerOff = true;
      setButtonsEnabled(false);
      setStatus(false, "쇼케이스 전원을 종료하는 중…");

      await writeBLEText("poweroff");

      await sleep(250);

      if (bluetoothDevice?.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
    } catch (error) {
      intentionalPowerOff = false;
      console.error("전원 종료 명령 실패:", error);
      alert("전원 종료 명령을 보내지 못했어요. 다시 시도해 주세요.");
      setButtonsEnabled(true);
    }
  }

  function disconnectBLE() {
    intentionalPowerOff = false;

    if (bluetoothDevice?.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    bluetoothCharacteristic = null;
    bleWriteQueue = Promise.resolve();

    if (intentionalPowerOff) {
      setStatus(false, "Power Off · 쇼케이스 종료");
    } else {
      setStatus(false, "연결 해제 · 전시 상태 유지");
    }

    controls.style.display = "none";
    setButtonsEnabled(false);

    connectBtn.style.display = "block";
    connectBtn.disabled = false;
    connectBtn.textContent = "같은 쇼케이스 다시 연결";

    let otherBtn = document.getElementById("otherShowcaseBtn");
    if (otherBtn) {
      otherBtn.style.display = "block";
    }

    intentionalPowerOff = false;
  }

  function forgetCurrentDevice() {
    if (bluetoothDevice?.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }

    bluetoothDevice = null;
    bluetoothCharacteristic = null;
    bleWriteQueue = Promise.resolve();
    authenticated = false;
    authenticatedDeviceName = "";

    sessionStorage.removeItem("showcaseAuthenticatedDevice");

    setStatus(false, "새 쇼케이스를 선택할 준비가 됐어요.");

    connectBtn.style.display = "block";
    connectBtn.textContent = "쇼케이스 연결하기";
    controls.style.display = "none";

    const otherBtn = document.getElementById("otherShowcaseBtn");
    if (otherBtn) otherBtn.style.display = "none";

    setButtonsEnabled(false);
  }

  function setStatus(connected, text) {
    status.className = connected
      ? "status connected"
      : "status disconnected";

    statusText.textContent = text;

    if (connected) {
      app.classList.add("connected-layout");
    } else {
      app.classList.remove("connected-layout");
    }
  }

  function setButtonsEnabled(enabled) {
    [
      "btn-warm",
      "btn-sunset",
      "btn-wave",
      "btn-rainbow",
      "btn-party",
      "btn-weather",
      "btn-off"
    ].forEach(id => {
      document.getElementById(id).disabled = !enabled;
    });
  }
</script>
