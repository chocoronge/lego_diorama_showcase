<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Diorama Showcase</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: #38bdf8; }
        .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
        .status {
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            background: #334155;
        }
        .status.connected { background: #065f46; color: #34d399; }
        .status.disconnected { background: #7f1d1d; color: #fca5a5; }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:disabled { background: #475569 !important; color: #94a3b8; cursor: not-allowed; }
        #connectBtn { background: #0284c7; color: white; }
        #connectBtn:hover:not(:disabled) { background: #0ea5e9; }
        .control-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .btn-mode { background: #334155; color: white; }
        .btn-mode:hover:not(:disabled) { background: #475569; }
        .btn-off { background: #b91c1c; color: white; }
        .btn-off:hover:not(:disabled) { background: #dc2626; }
        .footer { margin-top: 25px; font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h1>LEGO Showcase</h1>
    <div class="subtitle">Smart IoT Control Panel</div>

    <div id="status" class="status disconnected">블루투스 연결이 되지 않았어요</div>

    <button id="connectBtn" onclick="connectBLE()">블루투스 기기 연결</button>

    <div id="controls" class="control-group" style="display:none;">
        <button class="btn-mode" onclick="sendMode('warm')" id="btn-warm" disabled>✨ 감성 무드등 (Warm)</button>
        <button class="btn-mode" onclick="sendMode('sunset')" id="btn-sunset" disabled>🌅 노을빛 (Sunset)</button>
        <button class="btn-mode" onclick="sendMode('wave')" id="btn-wave" disabled>🌊 오션 웨이브 (Wave)</button>
        <button class="btn-mode" onclick="sendMode('rainbow')" id="btn-rainbow" disabled>🌈 무지개 파티 (Rainbow)</button>
        <button class="btn-mode" onclick="sendMode('party')" id="btn-party" disabled>🎉 클럽 파티 (Party)</button>
        <button class="btn-off" onclick="sendMode('off')" id="btn-off" disabled>🔌 조명 끄기 (Off)</button>
        <button style="background: #475569; color: white; margin-top: 10px;" onclick="disconnectBLE()">연결 해제하기</button>
    </div>

    <div class="footer">LEGO Diorama Showcase Project v4.3</div>
</div>

<script>
    const correctPassword = "1234"; // 💡 필요시 비밀번호 수정
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    async function connectBLE() {
        try {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "기기 검색 중...";

            // 1. 기기 요청 (namePrefix와 optionalServices 필수)
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'LegoDiorama' }],
                optionalServices: [SERVICE_UUID]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            statusDiv.innerText = "서버에 연결 중...";
            const server = await bluetoothDevice.gatt.connect();

            statusDiv.innerText = "서비스 찾는 중...";
            const service = await server.getPrimaryService(SERVICE_UUID);

            statusDiv.innerText = "특성(Characteristic) 가져오는 중...";
            bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // 2. 비밀번호 인증 단계
            let password = prompt("블루투스 제어 비밀번호를 입력하세요:");
            
            if (password !== correctPassword) {
                alert("비밀번호가 틀렸습니다! 다시 시도해주세요.");
                // 틀렸을 경우 즉시 연결 해제 및 버튼 복구
                if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                    bluetoothDevice.gatt.disconnect();
                }
                return;
            }

            // 인증 성공 시
            alert("비밀번호가 확인되었습니다!");
            await bluetoothCharacteristic.writeValue(new TextEncoder().encode("PIN:OK"));

            // UI 변경 (연결 성공 상태)
            statusDiv.className = "status connected";
            statusDiv.innerText = "블루투스 연결됨 (" + bluetoothDevice.name + ")";
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            
            // 버튼 활성화
            setButtonsEnabled(true);

        } catch (error) {
            console.log("연결 실패:", error);
            const statusDiv = document.getElementById('status');
            statusDiv.className = "status disconnected";
            statusDiv.innerText = "연결이 취소되었거나 실패했습니다.";
            document.getElementById('connectBtn').disabled = false;
        }
    }

    async function sendMode(mode) {
        if (!bluetoothCharacteristic) {
            alert("블루투스가 연결되어 있지 않습니다!");
            return;
        }
        try {
            const encoder = new TextEncoder();
            await bluetoothCharacteristic.writeValue(encoder.encode(mode));
            console.log("명령 전송 성공: " + mode);
        } catch (error) {
            console.log("명령 전송 실패:", error);
            alert("명령 전송에 실패했습니다.");
        }
    }

    function disconnectBLE() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    }

    function onDisconnected() {
        console.log("블루투스 연결이 끊어졌습니다.");
        const statusDiv = document.getElementById('status');
        statusDiv.className = "status disconnected";
        statusDiv.innerText = "블루투스 연결이 해제되었습니다.";
        
        // UI 원복 (다시 연결할 수 있도록 버튼 활성화)
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('controls').style.display = 'none';
        setButtonsEnabled(false);
        
        bluetoothDevice = null;
        bluetoothCharacteristic = null;
    }

    function setButtonsEnabled(enabled) {
        document.getElementById('btn-warm').disabled = !enabled;
        document.getElementById('btn-sunset').disabled = !enabled;
        document.getElementById('btn-wave').disabled = !enabled;
        document.getElementById('btn-rainbow').disabled = !enabled;
        document.getElementById('btn-party').disabled = !enabled;
        document.getElementById('btn-off').disabled = !enabled;
    }
</script>

</body>
</html>
