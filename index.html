<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레고 디오라마 쇼케이스 💡</title>
  <style>
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      box-sizing: border-box;
    }
    .logo-icon { font-size: 42px; margin-bottom: 5px; }
    h2 { color: #2c3e50; margin: 5px 0 5px 0; font-size: 22px; font-weight: 800; }
    .sub-text { font-size: 13px; color: #7f8c8d; margin-bottom: 20px; }
    .status {
      font-size: 14px;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 14px;
      font-weight: bold;
      transition: 0.3s;
    }
    .disconnected { background: #fff5f5; color: #e53e3e; border: 2px dashed #feb2b2; }
    .connected { background: #f0fff4; color: #38a169; border: 2px solid #68d391; }
    .btn-conn-group { display: flex; gap: 10px; margin-bottom: 25px; }
    .btn-conn { background: #48bb78; color: white; flex: 1; }
    .btn-disconn { background: #fc8181; color: white; flex: 1; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    button {
      padding: 14px 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    button:active { transform: scale(0.95); box-shadow: none; }
    button:disabled {
      background: #e2e8f0 !important;
      color: #a0aec0 !important;
      cursor: not-allowed;
      box-shadow: none !important;
      transform: none !important;
    }
    .btn-off { background: #718096; grid-column: span 2; }
    .btn-warm { background: #ecc94b; color: #744210; }
    .btn-sunset { background: #ed8936; }
    .btn-wave { background: #319795; grid-column: span 2; }
    .btn-rainbow { background: linear-gradient(135deg, #f56565, #ed8936, #48bb78, #4299e1, #9f7aea); }
    .btn-party { background: #ed64a6; }
    .footer-note { font-size: 11px; color: #cbd5e0; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-icon">🧱✨</div>
    <h2>레고 디오라마 쇼케이스</h2>
    <div class="sub-text">빛으로 완성하는 역동적인 작은 세상</div>
    
    <div id="status-box" class="status disconnected">🔌 쇼케이스와 연결이 안 되었어요</div>
    
    <div class="btn-conn-group">
      <button class="btn-conn" id="connectBtn" onclick="connectBLE()">블루투스 연결</button>
      <button class="btn-disconn" id="disconnectBtn" onclick="disconnectBLE()" disabled>연결 끊기</button>
    </div>
    
    <div class="btn-grid">
      <button class="btn-warm" onclick="sendData('warm')" disabled>🌙 숨쉬는 감성등</button>
      <button class="btn-sunset" onclick="sendData('sunset')" disabled>🌅 노을빛 석양</button>
      <button class="btn-wave" onclick="sendData('wave')" disabled>🏄‍♂️ 홀짝 흰/파 파도타기</button>
      <button class="btn-rainbow" onclick="sendData('rainbow')" disabled>🌈 빙글빙글 무지개</button>
      <button class="btn-party" onclick="sendData('party')" disabled>✨ 반짝반짝 스파클</button>
      <button class="btn-off" onclick="sendData('off')" disabled>💤 조명 잠시 끄기</button>
    </div>

    <div class="footer-note">LEGO Diorama Showcase Project v4.2</div>
  </div>

  <script>
    let bluetoothDevice;
    let bluetoothCharacteristic;

    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";
    
    // 💡 [비밀번호 변경] 원하시는 비밀번호로 수정하세요!
    const correctPassword = "1234";

    async function connectBLE() {
      try {
        const box = document.getElementById('status-box');
        box.innerText = "🔍 쇼케이스를 찾는 중이에요...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          // 💡 아두이노 기기 이름 앞부분과 일치해야 합니다 ('LegoDiorama')
          filters: [{ namePrefix: 'LegoDiorama' }],
          optionalServices: [SERVICE_UUID]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        let pin = prompt("🔒 쇼케이스 비밀번호를 입력하세요:", "");
        
        if (pin === null) {
          await server.disconnect();
          setConnectedUI(false);
          return;
        }

        if (pin !== correctPassword) {
          alert("❌ 비밀번호가 틀렸습니다! 다시 확인해주세요.");
          await server.disconnect();
          setConnectedUI(false);
          return;
        }

        const encoder = new TextEncoder();
        await bluetoothCharacteristic.writeValue(encoder.encode("PIN:" + pin));

        setConnectedUI(true);
      } catch (error) {
        console.log('연결 실패:', error);
        alert('블루투스 연결에 실패했어요. 기기 전원과 권한을 확인해주세요!');
        setConnectedUI(false);
      }
    }

    async function disconnectBLE() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        await bluetoothDevice.gatt.disconnect();
      }
      bluetoothDevice = null;
      setConnectedUI(false);
    }

    function onDisconnected() {
      bluetoothDevice = null;
      setConnectedUI(false);
    }

    async function sendData(command) {
      if (!bluetoothCharacteristic) {
        alert("쇼케이스와 연결되어 있지 않아요!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await bluetoothCharacteristic.writeValue(encoder.encode(command));
      } catch (error) {
        console.log('데이터 전송 실패:', error);
      }
    }

    function setConnectedUI(isConnected) {
      const box = document.getElementById('status-box');
      const connectBtn = document.getElementById('connectBtn');
      const disconnectBtn = document.getElementById('disconnectBtn');
      const controlBtns = document.querySelectorAll('.btn-grid button');

      if (isConnected) {
        box.className = 'status connected';
        box.innerText = '✨ 쇼케이스와 연결 완료!';
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        controlBtns.forEach(btn => btn.disabled = false);
      } else {
        box.className = 'status disconnected';
        box.innerText = '🔌 쇼케이스와 연결이 안 되었어요';
        connectBtn.disabled = false;
        connectBtn.disabled = true;
        controlBtns.forEach(btn => btn.disabled = true);
      }
    }
  </script>
</body>
</html>
